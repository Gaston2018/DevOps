name: Build Docker Image

on:
  push:
    branches:
      - main  # O el branch que quieras

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t Docker/rivainera:1.0 .
