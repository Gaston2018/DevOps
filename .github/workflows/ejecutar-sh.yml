name: Ejecutar mi script

on: [push]  # O también podrías poner 'workflow_dispatch' para ejecutarlo manualmente

jobs:
  run-script:
    runs-on: ubuntu-latest  # Usa una máquina virtual Ubuntu
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Dar permisos de ejecución al script
        run: chmod +x Bash/1.sh

      - name: Ejecutar el script
        run: Bash/1.sh
